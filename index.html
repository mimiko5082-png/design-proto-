<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5ed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ことばの森" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="ことばの森は、見た景色を写真に撮り、その景色に近い日本語と出会うスマホWebプロトタイプです。"
    />
    <title>ことばの森</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" sizes="192x192" href="./assets/kotoba-icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="ことばの森 Webプロトタイプ">
      <section class="phone" aria-live="polite">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span>5G</span>
        </div>

        <section class="screen" id="screen"></section>

        <nav class="tabbar" aria-label="メインメニュー">
          <button class="tab active" type="button" data-nav="home">
            <span class="tab-icon">⌂</span>
            ホーム
          </button>
          <button class="tab" type="button" data-nav="notebook">
            <span class="tab-icon">▣</span>
            ことば帳
          </button>
          <button class="tab" type="button" data-nav="map">
            <span class="tab-icon">⌖</span>
            地図
          </button>
        </nav>
      </section>

      <div class="toast" id="toast" role="status"></div>
    </main>

    <script src="./app.js?v=20260807-kotoba-camera-switch-v10"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
