<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecdc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="芭蕉のまなざし" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="芭蕉のまなざしは、目的地ではなく街の見方を受け取り、原典から抽出した観察を今の街歩きへ変えるスマホWebアプリです。" />
    <title>芭蕉のまなざし</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" sizes="192x192" href="./assets/kotoba-icon-192.png" />
    <link rel="stylesheet" href="./basho-styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="芭蕉のまなざし Webアプリ">
      <section class="phone" aria-live="polite">
        <section class="screen" id="screen"></section>
        <nav class="tabbar" aria-label="メインメニュー">
          <button class="tab active" type="button" data-nav="home"><span class="tab-icon">◎</span>まなざし</button>
          <button class="tab" type="button" data-nav="map"><span class="tab-icon">▰</span>地図</button>
          <button class="tab" type="button" data-nav="notebook"><span class="tab-icon">▤</span>句帳</button>
        </nav>
      </section>
      <div class="toast" id="toast" role="status"></div>
    </main>
    <script src="./firebase-config.js?v=20260814-basho-no-status-v31"></script>
    <script type="module" src="./basho-app.js?v=20260814-basho-no-status-v31"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
