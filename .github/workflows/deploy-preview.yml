name: Update preview only

on:
  push:
    branches:
      - codex-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basho-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/codex-preview' && github.repository == 'mimiko5082-png/design-proto-'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build downloadable preview without Cloudflare credentials
        run: |
          npm ci --prefix preview --ignore-scripts --no-audit --no-fund
          npm --prefix preview run share
      - name: Attach browser preview HTML
        uses: actions/upload-artifact@v4
        with:
          name: basho-preview-html
          path: preview/share.html
          retention-days: 7
      - name: Build and validate isolated preview
        run: |
          node preview/build.mjs
          node --test tests/*.test.mjs
      - name: Verify Firebase participant-only rules in the emulator
        run: |
          export FIREBASE_TEST_DEPS="$RUNNER_TEMP/firebase-tests"
          npm install --prefix "$FIREBASE_TEST_DEPS" --ignore-scripts --no-audit --no-fund firebase-tools@15.36.0 @firebase/rules-unit-testing@6.0.0 firebase@13.3.0
          "$FIREBASE_TEST_DEPS/node_modules/.bin/firebase" emulators:exec --only database --project demo-basho-friends --config firebase.json "node --test tests/firebase-friends-rules.test.mjs"
      - name: Initial setup is still needed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo '::notice::Preview deployment is waiting for CLOUDFLARE_PREVIEW_API_TOKEN and CLOUDFLARE_PREVIEW_ACCOUNT_ID repository secrets. No deployment was attempted.'
      - name: Deploy basho-preview only
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node preview/deploy.mjs
