name: Verify production assets
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for GitHub Pages and verify deployed sharing files
        run: node scripts/verify-production.mjs
