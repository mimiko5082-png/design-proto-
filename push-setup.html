<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者用：通知の鍵を作成</title>
<style>body{max-width:680px;margin:32px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.8;color:#26382d;background:#faf7ef}label{display:block;margin-top:24px}input{display:block;width:100%;box-sizing:border-box;padding:12px;font:14px monospace}button{padding:12px 18px;margin:12px 8px 0 0;font:inherit;cursor:pointer}p{overflow-wrap:anywhere}</style></head>
<body><h1>管理者用：通知の鍵を作成</h1>
<p>このページは、通知サーバーを設定する管理者だけが使用します。ボタンを押すと、このブラウザ内で通知専用の鍵を作ります。外部へ送信せず、ブラウザにも保存しません。</p>
<button id="generate" type="button">通知用の鍵を作成する</button><p id="status" role="status"></p>
<section id="keys" hidden>
<label>公開鍵：Cloudflareの変数「VAPID_PUBLIC_KEY」へ<input id="public" readonly autocomplete="off"></label><button type="button" data-copy="public">公開鍵をコピー</button>
<label>秘密鍵：CloudflareのSecret「VAPID_PRIVATE_KEY」へ<input id="private" type="password" readonly autocomplete="off"></label><button type="button" data-copy="private">秘密鍵をコピー</button>
<p>秘密鍵はチャット・GitHub・スクリーンショットに含めないでください。このページはCloudflareへの登録が終わるまで閉じないでください。再読み込みすると生成した鍵は消えます。</p>
</section><script type="module" src="./push-setup.js"></script></body></html>
